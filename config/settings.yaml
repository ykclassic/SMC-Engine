# ------------------------------------------
# Core SMC Logic Parameters
# ------------------------------------------
market_structure:
  lookback_period: 2          # Changed from 5 to 2. (Requires only 5 candles total to confirm structure).
  structure_type: "body_close" 
  confirmation_candles: 2     

liquidity:
  eq_threshold: 0.0015        # Loosened slightly to catch more EQL/EQH zones
  sweep_buffer: 0.0003        # Reduced so minor wicks still trigger sweep logic
  search_depth: 30            

imbalance:
  min_gap_size: 0.0005        # Reduced to catch standard imbalances, not just macro dumps
  filter_mitigated: true      

order_blocks:
  lookback_candles: 100       
  require_fvg: false          # Changed to false. Allow strong BOS origin blocks even without immediate FVGs.
  mitigation_threshold: 0.5   
