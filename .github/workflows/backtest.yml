name: Weekly Strategy Backtest

on:
  schedule:
    - cron: '0 12 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-strategy-backtest
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: '.'
  EXCHANGE: 'bitget'

jobs:
  run-backtest:
    name: Validate and Execute Backtest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Package Structures
        run: |
          set -euo pipefail
          required_files=(
            "core/__init__.py"
            "models/__init__.py"
            "utils/__init__.py"
            "data/__init__.py"
          )
          for path in "${required_files[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "::error title=Repository integrity failure::$path is missing"
              exit 1
            fi
          done

      - name: Diagnostic Forensic Check - Inspect structure.py
        run: |
          set -euo pipefail
          echo "--- Searching for SMCEngine in core/structure.py ---"
          if grep -q "class SMCEngine" core/structure.py; then
            echo "WARNING: SMCEngine class found in core/structure.py. Review for circular import risk."
          else
            echo "SUCCESS: SMCEngine class is not defined in core/structure.py."
          fi
          echo "--- File Preview (First 15 lines) ---"
          head -n 15 core/structure.py

      - name: Execute Backtest
        env:
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_API_SECRET: ${{ secrets.EXCHANGE_API_SECRET }}
          EXCHANGE_PASSPHRASE: ${{ secrets.EXCHANGE_PASSPHRASE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/run_backtest.py

      - name: Upload Results Artifact
        if: success()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: backtest-report-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: reports/backtest_results.csv
