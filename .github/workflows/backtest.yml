name: Weekly Strategy Backtest

on:
  schedule:
    - cron: '0 12 * * 0' # Every Sunday at Noon
  workflow_dispatch: # Manual trigger

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Package Structures
        run: |
          # Anti-pattern fix: Alert the developer if __init__ files are missing in Git, 
          # but dynamically create them so the current run can proceed.
          for dir in core models utils data; do
            if [ ! -f "$dir/__init__.py" ]; then
              echo "Warning: $dir/__init__.py is missing from Git. Creating it dynamically for this run."
              touch "$dir/__init__.py"
            fi
          done

      - name: Diagnostic Forensic Check - Inspect structure.py
        run: |
          echo "--- Searching for SMCEngine in core/structure.py ---"
          if grep -q "class SMCEngine" core/structure.py; then
            echo "SUCCESS: SMCEngine class found in file. This indicates a Circular Import bug."
          else
            echo "ERROR: SMCEngine class is completely missing. You forgot to push the updated file."
          fi
          echo "--- File Preview (First 15 lines) ---"
          head -n 15 core/structure.py

      - name: Execute Backtest
        env:
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_API_SECRET: ${{ secrets.EXCHANGE_API_SECRET }}
          EXCHANGE_PASSPHRASE: ${{ secrets.EXCHANGE_PASSPHRASE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONPATH: . 
        run: python scripts/run_backtest.py

      - name: Upload Results Artifact
        if: success() # Only upload if the backtest execution actually succeeded
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: reports/backtest_results.csv
