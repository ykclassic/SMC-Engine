name: SMC Live Signal Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "."
  EXCHANGE: "bitget"
  SMC_AI_ENABLED: "false"

concurrency:
  group: smc-live-signal-monitor
  cancel-in-progress: false

jobs:
  execute_signal_pipeline:
    name: Ingest, Verify Deterministic Engine & Broadcast Signals
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: "pip"
          cache-dependency-path: requirements-live.txt

      - name: Install Live Dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-live.txt

      - name: Verify Deterministic Production Boundary
        run: |
          set -euo pipefail

          required_files=(
            "main.py"
            "core/__init__.py"
            "core/engine.py"
            "core/confluence.py"
            "core/structure.py"
            "core/zones.py"
            "models/__init__.py"
            "models/signal.py"
            "alerts/formatter.py"
            "utils/__init__.py"
            "utils/config_loader.py"
            "utils/journal.py"
            "utils/event_dedup.py"
            "data/__init__.py"
            "data/exchange_api.py"
          )

          for path in "${required_files[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "::error title=Production boundary failure::$path is missing"
              exit 1
            fi
          done

          if [[ -d "models/weights" ]] && find "models/weights" -maxdepth 1 -type f \( -name '*.pth' -o -name '*.pt' -o -name '*.joblib' \) -print -quit | grep -q .; then
            echo "::error title=AI dependency detected::Live production checkout must not contain downloaded AI model artifacts"
            exit 1
          fi

          python - <<'PY'
          import ast
          from pathlib import Path

          production_files = (
              Path("main.py"),
              Path("core/engine.py"),
              Path("core/confluence.py"),
              Path("core/structure.py"),
              Path("core/zones.py"),
              Path("data/exchange_api.py"),
              Path("alerts/discord_bot.py"),
              Path("alerts/formatter.py"),
              Path("utils/event_dedup.py"),
          )

          forbidden_imports = {"torch", "joblib", "models.inference"}
          violations = []

          for path in production_files:
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = {alias.name for alias in node.names}
                      violations.extend(
                          f"{path}: import {name}"
                          for name in names
                          if name in forbidden_imports
                      )
                  elif isinstance(node, ast.ImportFrom):
                      module = node.module or ""
                      if module in forbidden_imports:
                          violations.append(
                              f"{path}: from {module} import ..."
                          )

          if violations:
              raise SystemExit(
                  "AI imports detected in production path:\n"
                  + "\n".join(violations)
              )

          formatter_source = Path("alerts/formatter.py").read_text(
              encoding="utf-8"
          )
          if "DETERMINISTIC SMC | AI DISABLED" not in formatter_source:
              raise SystemExit(
                  "Deterministic formatter must explicitly identify AI-disabled signals"
              )

          print("Deterministic production boundary verified")
          print("Deterministic alert provenance verified")
          print("Causal event deduplication module verified")
          PY

      - name: Verify Bitget Production Configuration
        env:
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_API_SECRET: ${{ secrets.EXCHANGE_API_SECRET }}
          EXCHANGE_PASSPHRASE: ${{ secrets.EXCHANGE_PASSPHRASE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [[ "${EXCHANGE}" != "bitget" ]]; then
            echo "::error title=Invalid production exchange::Expected EXCHANGE=bitget, got ${EXCHANGE}"
            exit 1
          fi

          python - <<'PY'
          from utils.config_loader import load_all_configs

          config = load_all_configs()
          if str(config.get("trading", {}).get("exchange", "")).lower() != "bitget":
              raise SystemExit("Production exchange configuration is not Bitget")
          if config.get("model", {}).get("enabled") is not False:
              raise SystemExit("Production AI boundary is not disabled")
          if config.get("model", {}).get("required") is not False:
              raise SystemExit("Production model artifacts remain required")

          symbols = config.get("trading", {}).get("symbols", [])
          if not symbols:
              raise SystemExit("No production trading symbols configured")

          print("Verified production exchange: bitget")
          print(f"Verified production symbols: {symbols}")
          print("Verified production AI mode: disabled")
          print("Verified production model requirement: false")
          PY

      - name: Run Deterministic Signal Engine
        env:
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_API_SECRET: ${{ secrets.EXCHANGE_API_SECRET }}
          EXCHANGE_PASSPHRASE: ${{ secrets.EXCHANGE_PASSPHRASE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          python main.py
