name: Nexus Live Signal Monitor

on:
  schedule:
    - cron: "*/15 * * * *"  # Executes every 15 minutes
  workflow_dispatch:        # Enables manual triggering from the GitHub Actions tab

permissions:
  contents: read

concurrency:
  group: nexus-live-signal-monitor
  cancel-in-progress: false  # Queues overlapping runs to prevent API collision

jobs:
  execute_signal_pipeline:
    name: Ingest, Analyze & Broadcast Signals
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Signal Engine Daemon
        env:
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_API_SECRET: ${{ secrets.EXCHANGE_API_SECRET }}
          EXCHANGE_PASSPHRASE: ${{ secrets.EXCHANGE_PASSPHRASE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONPATH: .
        run: |
          echo "🚀 Starting Nexus Signal Pipeline..."
          python main.py
