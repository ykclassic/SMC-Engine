name: CD - Deploy SMC Engine to Render

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_smoke_test:
        description: 'Execute API Smoke Test before deployment?'
        required: true
        type: boolean
        default: true
      deploy_reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual maintenance'

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: '.'
  EXCHANGE: 'xt'

jobs:
  deploy:
    name: Production Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '${{ env.PYTHON_VERSION }}'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Verify Repository Integrity
        run: |
          set -euo pipefail
          required_files=(
            "core/__init__.py"
            "models/__init__.py"
            "utils/__init__.py"
            "data/__init__.py"
          )
          for path in "${required_files[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "::error title=Repository integrity failure::$path is missing"
              exit 1
            fi
          done

      - name: Install Project Dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Execute API Smoke Test
        if: github.event_name == 'push' || inputs.run_smoke_test == true
        env:
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_API_SECRET: ${{ secrets.EXCHANGE_API_SECRET }}
          EXCHANGE_PASSPHRASE: ${{ secrets.EXCHANGE_PASSPHRASE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/smoke_test.py

      - name: Validate Render Deployment Configuration
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in RENDER_DEPLOY_HOOK_URL RENDER_API_KEY RENDER_SERVICE_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing Render secret::$name is not configured"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          if [[ ! "$RENDER_SERVICE_ID" =~ ^srv-[A-Za-z0-9_-]+$ ]]; then
            echo "::error title=Invalid Render service ID::$RENDER_SERVICE_ID"
            exit 1
          fi

      - name: Trigger Render Deployment for Exact Commit
        id: render_deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [[ "$RENDER_DEPLOY_HOOK_URL" == *\?* ]]; then
            deploy_url="${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"
          else
            deploy_url="${RENDER_DEPLOY_HOOK_URL}?ref=${GITHUB_SHA}"
          fi

          response_file="render_deploy_response.json"
          http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            "$deploy_url")"

          case "$http_code" in
            200)
              echo "Render accepted deployment for commit ${GITHUB_SHA}."
              ;;
            202)
              echo "::error title=Render deployment queued::Render reported another deployment in progress; refusing to claim deployment success without an identifiable deploy ID."
              cat "$response_file"
              exit 1
              ;;
            *)
              echo "::error title=Render deployment trigger failed::HTTP ${http_code}"
              cat "$response_file"
              exit 1
              ;;
          esac

          deploy_id="$(python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("render_deploy_response.json").read_text(encoding="utf-8"))
          deploy = payload.get("deploy", payload)
          deploy_id = deploy.get("id")
          if not deploy_id:
              raise SystemExit("Render response did not contain a deploy ID")
          print(deploy_id)
          PY
          )"

          echo "RENDER_DEPLOY_ID=$deploy_id" >> "$GITHUB_ENV"
          echo "Render deploy ID: $deploy_id"

      - name: Wait for Render Deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1800))
          terminal_failure='build_failed|update_failed|pre_deploy_failed|canceled|deactivated'

          while (( SECONDS < deadline )); do
            response="$(curl --silent --show-error --fail \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Accept: application/json" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${RENDER_DEPLOY_ID}")"

            status="$(python -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<< "$response")"
            commit="$(python -c 'import json,sys; d=json.load(sys.stdin); print((d.get("commit") or {}).get("id", ""))' <<< "$response")"

            echo "Render deploy ${RENDER_DEPLOY_ID}: status=${status}, commit=${commit}"

            if [[ "$commit" != "$GITHUB_SHA" ]]; then
              echo "::error title=Render commit mismatch::Expected ${GITHUB_SHA}, got ${commit:-unknown}"
              exit 1
            fi

            case "$status" in
              live)
                echo "Render deployment is live for ${GITHUB_SHA}."
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error title=Render deployment failed::Terminal status: ${status}"
                exit 1
                ;;
              created|queued|build_in_progress|update_in_progress|pre_deploy_in_progress)
                sleep 10
                ;;
              *)
                echo "::error title=Unknown Render deployment status::${status}"
                exit 1
                ;;
            esac
          done

          echo "::error title=Render deployment timeout::Deployment did not reach live within 30 minutes."
          exit 1

      - name: Production Health Check
        env:
          RENDER_HEALTHCHECK_URL: ${{ secrets.RENDER_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_HEALTHCHECK_URL:-}" ]]; then
            echo "::error title=Missing Render health check URL::RENDER_HEALTHCHECK_URL is not configured"
            exit 1
          fi

          for attempt in {1..12}; do
            if curl --silent --show-error --fail --location \
              --connect-timeout 10 \
              --max-time 20 \
              "$RENDER_HEALTHCHECK_URL" >/tmp/render_health.json; then
              echo "Production health check passed on attempt ${attempt}."
              cat /tmp/render_health.json
              exit 0
            fi
            echo "Health check attempt ${attempt}/12 failed; waiting 10 seconds."
            sleep 10
          done

          echo "::error title=Production health check failed::Render is live but the configured health endpoint did not respond successfully."
          exit 1

      - name: Deployment Summary
        if: always()
        run: |
          {
            echo "## Render Production Deployment"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Workflow: \`${GITHUB_RUN_ID}\`"
            echo "- Exchange default: \`${EXCHANGE}\`"
            echo "- Render deploy ID: \`${RENDER_DEPLOY_ID:-not-created}\`"
            echo "- Reason: \`${{ inputs.deploy_reason || 'Automatic Push' }}\`"
            echo "- Deployment target: Render"
            echo "- Deployment success requires Render status \`live\` and a successful production health check."
          } >> "$GITHUB_STEP_SUMMARY"
