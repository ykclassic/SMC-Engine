name: AI - Model Retraining Pipeline

on:
  schedule:
    - cron: "0 0 * * 6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/train_models.py"
      - "scripts/validate_model.py"
      - "core/**"
      - "config/settings.yaml"
      - "requirements-train.txt"

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  retrain-model:
    name: Train, Validate, and Version Model
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ai-retraining
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install Training Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt

      - name: Validate Secrets
        env:
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_API_SECRET: ${{ secrets.EXCHANGE_API_SECRET }}
          EXCHANGE_PASSPHRASE: ${{ secrets.EXCHANGE_PASSPHRASE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          for name in EXCHANGE_API_KEY EXCHANGE_API_SECRET EXCHANGE_PASSPHRASE DISCORD_WEBHOOK_URL; do
            if [ -z "${!name}" ]; then echo "Missing $name"; exit 1; fi
          done

      - name: Train on Real Market Data
        env:
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_API_SECRET: ${{ secrets.EXCHANGE_API_SECRET }}
          EXCHANGE_PASSPHRASE: ${{ secrets.EXCHANGE_PASSPHRASE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/train_models.py

      - name: Validate Out-of-Sample Metrics
        env:
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_API_SECRET: ${{ secrets.EXCHANGE_API_SECRET }}
          EXCHANGE_PASSPHRASE: ${{ secrets.EXCHANGE_PASSPHRASE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/validate_model.py

      - name: Upload Validated Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validated-gru-${{ github.sha }}
          path: |
            models/weights/latest_gru.pth
            models/weights/feature_scaler.joblib
            models/weights/model_metadata.json

      - name: Commit Validated Model
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add models/weights/latest_gru.pth models/weights/feature_scaler.joblib models/weights/model_metadata.json
          git diff --cached --quiet && echo "No model changes." && exit 0
          git commit -m "ci: promote validated SMC model"
          git push origin HEAD:main
