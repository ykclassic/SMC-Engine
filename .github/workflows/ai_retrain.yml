name: AI - Research Retraining

# AI training is explicitly a research workflow. It must never gate
# deterministic production validation, deployment, or live execution.
on:
  workflow_dispatch:
    inputs:
      run_full_training:
        description: "Run the full AI training experiment"
        required: false
        default: true
        type: boolean
      run_ablation:
        description: "Run the controlled feature ablation experiment"
        required: false
        default: true
        type: boolean
  push:
    paths:
      - '.github/workflows/ai_retrain.yml'
      - 'scripts/ablation_feature_groups.py'
      - 'scripts/diagnose_candidate_label_integrity.py'
      - 'scripts/train_models_integrity_unweighted.py'
      - 'scripts/train_models_integrity.py'
      - 'scripts/train_models.py'
      - 'models/**'
      - 'core/training_events.py'
      - 'requirements-train.txt'
  schedule:
    - cron: "0 0 * * 6"

permissions:
  contents: read

concurrency:
  group: ai-research-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  PYTHONPATH: .
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  EXCHANGE: "bitget"

jobs:
  research:
    name: AI research experiments
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install Research Dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements-train.txt

      - name: Run Repository Tests
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Run Candidate and Label Diagnostics
        env:
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_API_SECRET: ${{ secrets.EXCHANGE_API_SECRET }}
          EXCHANGE_PASSPHRASE: ${{ secrets.EXCHANGE_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/ai_research
          python scripts/diagnose_candidate_label_integrity.py \
            --output artifacts/ai_research/candidate_label_integrity.json

      - name: Run Controlled Ablation
        if: ${{ inputs.run_ablation != false }}
        env:
          ABLATION_EPOCHS: "20"
          ABLATION_SEED: "42"
        run: |
          set -euo pipefail
          mkdir -p artifacts/ai_research
          python scripts/ablation_feature_groups.py \
            --epochs "${ABLATION_EPOCHS}" \
            --seed "${ABLATION_SEED}" \
            --output artifacts/ai_research/ablation_results.json

      - name: Run Full AI Training Experiment
        if: ${{ inputs.run_full_training != false }}
        env:
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_API_SECRET: ${{ secrets.EXCHANGE_API_SECRET }}
          EXCHANGE_PASSPHRASE: ${{ secrets.EXCHANGE_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/ai_research/training
          python scripts/train_models_integrity_unweighted.py \
            --experiment-mode \
            --output artifacts/ai_research/training/training_experiment.json

      - name: Verify Research Artifact Boundary
        if: always()
        run: |
          set -euo pipefail

          if [[ -d models/weights ]]; then
            if find models/weights -type f -print -quit | grep -q .; then
              echo "Research workflow wrote into production model-artifact boundary: models/weights"
              find models/weights -type f -print
              exit 1
            fi
          fi

          if git status --porcelain -- models/weights | grep -q .; then
            echo "Research workflow modified the production model-artifact boundary"
            git status --short -- models/weights
            exit 1
          fi

          test -d artifacts/ai_research
          echo "AI research artifact boundary verified: artifacts/ai_research only"

      - name: Verify Research Artifacts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/ai_research
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/ai_research")
          manifest = {
              "schema_version": "ai-research-v1",
              "research_only": True,
              "production_dependency": False,
              "promotion_enabled": False,
              "commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "artifacts": {},
          }

          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.name == "research_manifest.json":
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              manifest["artifacts"][str(path.relative_to(root))] = {
                  "sha256": digest,
                  "bytes": path.stat().st_size,
              }

          (root / "research_manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          if not manifest["artifacts"]:
              raise SystemExit("No research artifacts were produced")
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Upload Research Artifacts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: ai-research-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/ai_research

      - name: Research Summary
        if: always()
        run: |
          {
            echo "## AI Research Workflow"
            echo ""
            echo "- Research only: true"
            echo "- Production dependency: false"
            echo "- Model promotion: disabled"
            echo "- Production model-artifact boundary: untouched"
            echo "- Deterministic production baseline: untouched"
            echo "- Research artifacts: \`artifacts/ai_research\`"
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Workflow run: \`${GITHUB_RUN_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"
