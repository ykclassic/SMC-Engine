name: AI - Model Retraining Pipeline

on:
  schedule:
    - cron: "0 0 * * 6"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ai_retrain.yml"
      - "scripts/train_models.py"
      - "scripts/train_models_calibrated.py"
      - "scripts/train_models_calibration_diagnostic.py"
      - "scripts/train_models_integrity.py"
      - "scripts/train_models_ablation.py"
      - "scripts/validate_model.py"
      - "core/**"
      - "models/**/*.py"
      - "data/**"
      - "utils/**"
      - "config/settings.yaml"
      - "config/constants.py"
      - "requirements-train.txt"
      - "tests/**"

permissions:
  contents: write

env:
  PYTHONPATH: .
  PYTHONUNBUFFERED: "1"

defaults:
  run:
    shell: bash

jobs:
  retrain-model:
    name: Train, Validate, and Version Model
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ai-retraining
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install Training Dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements-train.txt

      - name: Python Compile Check
        run: |
          set -euo pipefail
          python -m compileall -q core scripts models data utils

      - name: Full Test Suite
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Runtime Diagnostics
        run: |
          set -euo pipefail
          python --version
          python -m pip --version
          git rev-parse HEAD
          git status --short

      - name: Validate Exchange Secrets
        env:
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_API_SECRET: ${{ secrets.EXCHANGE_API_SECRET }}
          EXCHANGE_PASSPHRASE: ${{ secrets.EXCHANGE_PASSPHRASE }}
        run: |
          set -euo pipefail
          missing=0
          for name in EXCHANGE_API_KEY EXCHANGE_API_SECRET EXCHANGE_PASSPHRASE; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing secret::$name is not configured"
              missing=1
            else
              echo "$name is configured."
            fi
          done
          if [[ "$missing" -ne 0 ]]; then exit 1; fi

      - name: Label Integrity and Context Ablation Diagnostics
        id: ablation
        env:
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_API_SECRET: ${{ secrets.EXCHANGE_API_SECRET }}
          EXCHANGE_PASSPHRASE: ${{ secrets.EXCHANGE_PASSPHRASE }}
        run: |
          set -euo pipefail
          python scripts/train_models_ablation.py

      - name: Upload Label and Context Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: label-context-ablation-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: models/weights/label_context_ablation.json

      - name: Train on Real Market Data
        id: training
        env:
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_API_SECRET: ${{ secrets.EXCHANGE_API_SECRET }}
          EXCHANGE_PASSPHRASE: ${{ secrets.EXCHANGE_PASSPHRASE }}
        run: |
          set -euo pipefail
          python scripts/train_models_integrity.py

      - name: Verify Training Artifacts
        run: |
          set -euo pipefail
          required=(
            "models/weights/latest_gru.pth"
            "models/weights/feature_scaler.joblib"
            "models/weights/model_metadata.json"
          )
          for path in "${required[@]}"; do
            if [[ ! -s "$path" ]]; then
              echo "::error title=Missing or empty training artifact::$path"
              exit 1
            fi
            echo "Verified: $path"
            ls -lh "$path"
          done

      - name: Inspect Training Metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from models.candidate_context import CONTEXT_COLUMNS, CONTEXT_VERSION
          path = Path("models/weights/model_metadata.json")
          metadata = json.loads(path.read_text(encoding="utf-8"))
          required = {
              "model_version", "feature_version", "feature_columns",
              "candidate_context_version", "candidate_context_columns",
              "sequence_length", "decision_threshold", "validation", "test",
              "trained_symbols", "total_labeled_candidates", "symbol_statistics",
              "model_sha256", "scaler_sha256", "training_positive_weight",
              "threshold_search",
          }
          missing = sorted(required.difference(metadata))
          if missing:
              raise SystemExit("Model metadata is missing: " + ", ".join(missing))
          if metadata["candidate_context_version"] != CONTEXT_VERSION:
              raise SystemExit("Candidate context version mismatch")
          if metadata["candidate_context_columns"] != list(CONTEXT_COLUMNS):
              raise SystemExit("Candidate context schema mismatch")
          threshold = float(metadata["decision_threshold"])
          if not 0.0 < threshold < 1.0:
              raise SystemExit(f"Invalid decision threshold: {threshold}")
          if int(metadata["total_labeled_candidates"]) <= 0:
              raise SystemExit("No labeled candidates were recorded")
          print(json.dumps(metadata, indent=2))
          PY

      - name: Validate Out-of-Sample Metrics
        id: validation
        run: |
          set -euo pipefail
          python scripts/validate_model.py

      - name: Verify Final Model Integrity
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          base = Path("models/weights")
          metadata = json.loads((base / "model_metadata.json").read_text(encoding="utf-8"))
          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()
          model_hash = sha256(base / "latest_gru.pth")
          scaler_hash = sha256(base / "feature_scaler.joblib")
          if model_hash != metadata["model_sha256"]:
              raise SystemExit("Model SHA-256 does not match metadata")
          if scaler_hash != metadata["scaler_sha256"]:
              raise SystemExit("Scaler SHA-256 does not match metadata")
          print(f"Model SHA-256 verified: {model_hash}")
          print(f"Scaler SHA-256 verified: {scaler_hash}")
          PY

      - name: Upload Validated Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validated-gru-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            models/weights/latest_gru.pth
            models/weights/feature_scaler.joblib
            models/weights/model_metadata.json

      - name: Commit Validated Model
        run: |
          set -euo pipefail
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add models/weights/latest_gru.pth models/weights/feature_scaler.joblib models/weights/model_metadata.json
          if git diff --cached --quiet; then
            echo "No model changes."
            exit 0
          fi
          MODEL_VERSION="$(python - <<'PY'
          import json
          with open("models/weights/model_metadata.json", encoding="utf-8") as handle:
              print(json.load(handle)["model_version"])
          PY
          )"
          git commit -m "ci: promote validated SMC model ${MODEL_VERSION}"
          git push origin HEAD:main

      - name: Training Diagnostics
        if: failure()
        run: |
          echo "Training pipeline failed."
          git status --short
          if [[ -d models/weights ]]; then
            find models/weights -maxdepth 1 -type f -printf '%f %s bytes\n'
          fi

      - name: Job Summary
        if: always()
        run: |
          {
            echo "## AI Retraining Pipeline"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Workflow: \`${GITHUB_RUN_ID}\`"
            echo "- Status: \`${{ job.status }}\`"
            echo "- Training: class-weighted BCE"
            echo "- Labels: keyed by (candidate_index, direction)"
            echo "- Candidate context: direction + event type"
            echo "- Ablation: baseline vs direction vs event vs combined"
            echo "- Calibration: aggregate validation threshold + chronological diagnostics"
            echo "- Test set: frozen and untouched during threshold selection"
            echo "- Promotion: only after artifact, metric, and hash gates pass"
          } >> "$GITHUB_STEP_SUMMARY"
