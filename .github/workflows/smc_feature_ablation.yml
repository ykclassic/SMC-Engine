name: SMC Feature Ablation

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Training epochs per ablation experiment"
        required: false
        default: "20"
        type: string
      seed:
        description: "Deterministic experiment seed"
        required: false
        default: "42"
        type: string
  push:
    paths:
      - "scripts/ablation_feature_groups.py"
      - "tests/test_feature_ablation.py"
      - "models/feature_engineering.py"
      - "models/gru.py"
      - "models/candidate_context.py"
      - "scripts/train_models_integrity.py"
      - "scripts/train_models.py"
      - "configs/**"
      - ".github/workflows/smc_feature_ablation.yml"

permissions:
  contents: read

concurrency:
  group: smc-feature-ablation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ablation:
    name: Controlled SMC feature ablation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [[ -f requirements-train.txt ]]; then
            python -m pip install -r requirements-train.txt
          elif [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          elif [[ -f pyproject.toml ]]; then
            python -m pip install .
          else
            echo "No supported dependency manifest found" >&2
            exit 1
          fi

      - name: Run feature and ablation harness tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_feature_engineering.py tests/test_feature_ablation.py

      - name: Run controlled ablation
        shell: bash
        env:
          ABLATION_EPOCHS: ${{ inputs.epochs || '20' }}
          ABLATION_SEED: ${{ inputs.seed || '42' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/feature_ablation
          python scripts/ablation_feature_groups.py \
            --epochs "${ABLATION_EPOCHS}" \
            --seed "${ABLATION_SEED}" \
            --output artifacts/feature_ablation/ablation_results.json

      - name: Verify ablation report integrity
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/feature_ablation/ablation_results.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/feature_ablation/ablation_results.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          required = {
              "schema_version",
              "selection_policy",
              "experiments",
              "validation_winner",
              "validation_winner_features",
              "selected_test_metrics",
          }
          missing = required.difference(payload)
          if missing:
              raise SystemExit(f"Ablation report missing keys: {sorted(missing)}")
          if payload.get("schema_version") != "smc-feature-ablation-v1":
              raise SystemExit(
                  f"Unexpected ablation schema: {payload.get('schema_version')!r}"
              )
          if payload.get("selection_policy") != "validation_only_then_single_test_evaluation":
              raise SystemExit("Ablation selection policy is not test-set isolated")
          if len(payload["experiments"]) != 5:
              raise SystemExit(
                  f"Expected 5 ablation experiments, got {len(payload['experiments'])}"
              )
          names = [row.get("experiment") for row in payload["experiments"]]
          expected = [
              "baseline",
              "baseline_plus_geometry",
              "baseline_plus_geometry_liquidity",
              "baseline_plus_geometry_liquidity_regime",
              "full_smc_v4",
          ]
          if names != expected:
              raise SystemExit(
                  f"Unexpected ablation order/matrix: expected={expected!r} got={names!r}"
              )
          if payload["validation_winner"] not in expected:
              raise SystemExit(
                  f"Invalid validation winner: {payload['validation_winner']!r}"
              )
          selected_test = payload["selected_test_metrics"]
          for metric in ("roc_auc", "precision", "recall", "f1", "coverage"):
              if metric not in selected_test:
                  raise SystemExit(f"Selected test metrics missing {metric!r}")
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload ablation report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: smc-feature-ablation-report
          path: artifacts/feature_ablation/ablation_results.json
          if-no-files-found: error
          retention-days: 14
