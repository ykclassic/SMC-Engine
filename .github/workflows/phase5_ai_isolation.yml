name: Phase 5 AI Research Isolation

on:
  workflow_dispatch:
  push:
    paths:
      - "main.py"
      - "core/**"
      - "data/**"
      - "alerts/**"
      - "models/**"
      - "scripts/verify_phase5_isolation.py"
      - "tests/test_phase5_phase6_gate.py"
      - "config/settings.yaml"
      - ".github/workflows/live_signal_monitor.yml"
      - ".github/workflows/phase5_ai_isolation.yml"

permissions:
  contents: read

concurrency:
  group: phase5-ai-isolation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify deterministic production / AI research boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python 3.11
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c
        with:
          python-version: "3.11"

      - name: Verify Phase 5 isolation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_phase5_isolation.py

      - name: Verify gate tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_phase5_phase6_gate.py

      - name: Verify production workflow remains deterministic
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SMC_AI_ENABLED: "false"' .github/workflows/live_signal_monitor.yml
          ! grep -q 'ablation_feature_groups' .github/workflows/live_signal_monitor.yml
          ! grep -q 'models/weights/latest_gru.pth' .github/workflows/live_signal_monitor.yml
          echo "Phase 5 production/research isolation verified"
